[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-tech-company-finder"
version = "0.2.0"
description = "Collect tech-company candidates across Indian tech hubs from public APIs."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.31.0"]

[project.scripts]
india-tech-finder = "hsr_tech_finder.cli:main"
hsr-tech-finder = "hsr_tech_finder.cli:main"
