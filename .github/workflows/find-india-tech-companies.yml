name: Find India tech companies

on:
  workflow_dispatch:
  schedule:
    # Small rotating batches every 6 hours to avoid Google/Overpass 429s.
    # GitHub Actions cron uses UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  find-companies:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # Optional repo secret. If unset, the CLI still runs with OpenStreetMap only.
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      # Optional repo variables for customization.
      TECH_FINDER_PRESET: ${{ vars.TECH_FINDER_PRESET }}
      TECH_FINDER_REGIONS: ${{ vars.TECH_FINDER_REGIONS }}
      TECH_FINDER_SOURCES: ${{ vars.TECH_FINDER_SOURCES }}
      TECH_FINDER_GRANULARITY: ${{ vars.TECH_FINDER_GRANULARITY }}
      TECH_FINDER_GRID_SIZE_M: ${{ vars.TECH_FINDER_GRID_SIZE_M }}
      TECH_FINDER_GRID_RADIUS_M: ${{ vars.TECH_FINDER_GRID_RADIUS_M }}
      TECH_FINDER_ZONE_RADIUS_M: ${{ vars.TECH_FINDER_ZONE_RADIUS_M }}
      TECH_FINDER_REGION_BATCH_SIZE: ${{ vars.TECH_FINDER_REGION_BATCH_SIZE }}
      TECH_FINDER_GOOGLE_POINT_BATCH_SIZE: ${{ vars.TECH_FINDER_GOOGLE_POINT_BATCH_SIZE }}
      TECH_FINDER_BATCH_INDEX: ${{ vars.TECH_FINDER_BATCH_INDEX }}
      TECH_FINDER_MIN_SCORE: ${{ vars.TECH_FINDER_MIN_SCORE }}
      TECH_FINDER_MAX_PAGES: ${{ vars.TECH_FINDER_MAX_PAGES }}
      TECH_FINDER_NO_GOOGLE_DETAILS: ${{ vars.TECH_FINDER_NO_GOOGLE_DETAILS }}
      TECH_FINDER_GOOGLE_REQUEST_SLEEP_S: ${{ vars.TECH_FINDER_GOOGLE_REQUEST_SLEEP_S }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find companies
        run: |
          set -euo pipefail
          PRESET="${TECH_FINDER_PRESET:-india-tech-cities}"
          SOURCES="${TECH_FINDER_SOURCES:-osm,google}"
          GRANULARITY="${TECH_FINDER_GRANULARITY:-hybrid}"
          GRID_SIZE_M="${TECH_FINDER_GRID_SIZE_M:-5000}"
          ZONE_RADIUS_M="${TECH_FINDER_ZONE_RADIUS_M:-4000}"
          REGION_BATCH_SIZE="${TECH_FINDER_REGION_BATCH_SIZE:-1}"
          GOOGLE_POINT_BATCH_SIZE="${TECH_FINDER_GOOGLE_POINT_BATCH_SIZE:-6}"
          BATCH_INDEX="${TECH_FINDER_BATCH_INDEX:-${GITHUB_RUN_NUMBER}}"
          MIN_SCORE="${TECH_FINDER_MIN_SCORE:-20}"
          MAX_PAGES="${TECH_FINDER_MAX_PAGES:-1}"
          GOOGLE_REQUEST_SLEEP_S="${TECH_FINDER_GOOGLE_REQUEST_SLEEP_S:-0.3}"

          EXTRA_ARGS=()
          if [ -n "${TECH_FINDER_REGIONS:-}" ]; then
            IFS=',' read -ra REGIONS <<< "$TECH_FINDER_REGIONS"
            for region in "${REGIONS[@]}"; do
              region="$(echo "$region" | xargs)"
              if [ -n "$region" ]; then
                EXTRA_ARGS+=(--region "$region")
              fi
            done
          fi
          if [ -n "${TECH_FINDER_GRID_RADIUS_M:-}" ]; then
            EXTRA_ARGS+=(--grid-radius-m "$TECH_FINDER_GRID_RADIUS_M")
          fi
          # Default true to avoid Place Details quota spikes. Set repo variable
          # TECH_FINDER_NO_GOOGLE_DETAILS=false if you want websites/phones.
          if [ "${TECH_FINDER_NO_GOOGLE_DETAILS:-true}" = "true" ]; then
            EXTRA_ARGS+=(--no-google-details)
          fi

          python -m india_tech_finder.cli find \
            --preset "$PRESET" \
            --sources "$SOURCES" \
            --granularity "$GRANULARITY" \
            --grid-size-m "$GRID_SIZE_M" \
            --zone-radius-m "$ZONE_RADIUS_M" \
            --region-batch-size "$REGION_BATCH_SIZE" \
            --google-point-batch-size "$GOOGLE_POINT_BATCH_SIZE" \
            --batch-index "$BATCH_INDEX" \
            --min-score "$MIN_SCORE" \
            --max-pages "$MAX_PAGES" \
            --google-request-sleep-s "$GOOGLE_REQUEST_SLEEP_S" \
            --merge-existing \
            --out-csv results/india_tech_companies.csv \
            --out-json results/india_tech_companies.json \
            "${EXTRA_ARGS[@]}"

          rows=$(( $(wc -l < results/india_tech_companies.csv) - 1 ))
          if [ "$rows" -le 0 ]; then
            echo "No rows exported; refusing to publish an empty result set."
            exit 1
          fi

      - name: Add run summary
        if: always()
        run: |
          {
            echo "## India Tech Company Finder"
            echo
            if [ -f results/india_tech_companies.csv ]; then
              count=$(( $(wc -l < results/india_tech_companies.csv) - 1 ))
              echo "Rows exported: **$count**"
              echo
              echo "This workflow uses small rotating batches and merges with existing results to avoid API 429s."
            else
              echo "No results file was created. Check logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-tech-companies-${{ github.run_number }}
          path: |
            results/india_tech_companies.csv
            results/india_tech_companies.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/india_tech_companies.csv results/india_tech_companies.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update India tech company results [skip ci]"
            git push
          fi
